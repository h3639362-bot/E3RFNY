<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E3RFNY - اعرف مين يعرفك</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    font-family: Arial, sans-serif;
    background: #101124;
    color: white;
    min-height: 100vh;
}
header {
    padding: 25px 8%;
    border-bottom: 1px solid #292941;
}
.logo {
    color: #a18cff;
    font-size: 30px;
    font-weight: bold;
}
.container {
    max-width: 700px;
    margin: 65px auto;
    padding: 25px;
}
h1 {
    text-align: center;
    font-size: 38px;
    margin-bottom: 15px;
}
.description {
    text-align: center;
    color: #aaaac0;
    margin-bottom: 35px;
    line-height: 1.8;
}
.card {
    background: #1c1d35;
    border: 1px solid #333451;
    border-radius: 18px;
    padding: 25px;
}
label {
    display: block;
    margin: 18px 0 10px;
}
input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #454564;
    background: #111225;
    color: white;
    font-size: 16px;
    margin-bottom: 10px;
}
button {
    border: none;
    background: #8065ff;
    color: white;
    padding: 14px 22px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 18px;
}
button:hover {
    background: #684ce8;
}
.question {
    border-top: 1px solid #393953;
    margin-top: 25px;
    padding-top: 15px;
}
.preview {
    display: none;
    margin-top: 25px;
    padding: 20px;
    background: #292443;
    border-radius: 12px;
    line-height: 2;
}
 .small-note {
    color: #c4c2d8;
    font-size: 13px;
    line-height: 1.8;
    margin-top: 14px;
}
.footer {
    text-align: center;
    color: #777;
    padding: 30px;
}
</style>
</head>
<body>

<header>
    <div class="logo">E3RFNY</div>
</header>

<main class="container">
    <h1>مين يعرفك <span style="color:#a18cff">بجد؟</span></h1>

    <p class="description">
        أنشئ اختبارك الخاص واختبر أصحابك!
        <br>
        وشوف مين أكتر شخص فاهمك.
    </p>

    <div class="card">
        <label>اسمك:</label>
        <input id="username" placeholder="اكتب اسمك هنا">

        <div id="questions"></div>

        <button onclick="addQuestion()">+ إضافة سؤال</button>
        <button onclick="createQuiz()">إنشاء الاختبار 🚀</button>

        <div class="preview" id="preview"></div>
    </div>
</main>

<div class="footer">© 2026 E3RFNY</div>

<script>
let questionCount = 0;
let currentQuiz = null;

function addQuestion() {
    questionCount++;

    const div = document.createElement("div");
    div.className = "question";

    div.innerHTML = `
        <label>السؤال رقم ${questionCount}:</label>
        <input class="q-text" placeholder="اكتب سؤالك">
        <input class="option" placeholder="الاختيار الأول">
        <input class="option" placeholder="الاختيار الثاني">
        <input class="option" placeholder="الاختيار الثالث">
        <input class="option" placeholder="الاختيار الرابع">
        <label>رقم الإجابة الصحيحة (من 1 إلى 4):</label>
        <input class="correct" type="number" min="1" max="4" placeholder="مثلاً 2">
    `;

    document.getElementById("questions").appendChild(div);
}

function createQuiz() {
    const name = document.getElementById("username").value.trim();

    if (!name) {
        alert("اكتب اسمك الأول!");
        return;
    }

    const questionElements = [...document.querySelectorAll(".question")];
    if (questionElements.length === 0) {
        alert("أضف سؤالاً واحداً على الأقل!");
        return;
    }

    const quizQuestions = [];

    for (const q of questionElements) {
        const title = q.querySelector(".q-text").value.trim();
        const options = [...q.querySelectorAll(".option")].map(x => x.value.trim());
        const correct = Number(q.querySelector(".correct").value);

        if (!title || options.some(x => !x) || ![1, 2, 3, 4].includes(correct)) {
            alert("أكمل السؤال والاختيارات وحدد الإجابة الصحيحة.");
            return;
        }

        quizQuestions.push({ title, options, correct });
    }

    currentQuiz = { name, questions: quizQuestions };
    showSharePreview();
}

function showSharePreview() {
    const preview = document.getElementById("preview");
    preview.style.display = "block";
    preview.innerHTML = `
        <h2>اختبار ${escapeHtml(currentQuiz.name)}</h2>
        <p>تم إنشاء اختبارك بنجاح! 🎉</p>
        <p>اضغط على زر مشاركة الرابط وابعته لأصحابك علشان يجاوبوا.</p>
        <button type="button" onclick="shareQuiz()">مشاركة رابط الاختبار 🔗</button>
        <p id="shareStatus" aria-live="polite"></p>
        <p class="small-note">مهم: لازم ترفع ملف الموقع على استضافة وتستخدم رابط الموقع المنشور، علشان أصحابك يقدروا يفتحوا الاختبار. الإجابات لن تصل إليك تلقائياً؛ استقبال إجابات الأصدقاء يحتاج قاعدة بيانات أو خدمة خلفية.</p>
    `;
    preview.scrollIntoView({ behavior: "smooth" });
}

function shareQuiz() {
    if (!currentQuiz) return;

    // The quiz data is encoded in the URL so the recipient can open the quiz.
    const encoded = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(currentQuiz)))));
    const shareUrl = `${location.origin}${location.pathname}#quiz=${encoded}`;

    if (navigator.share) {
        navigator.share({
            title: `اختبار ${currentQuiz.name}`,
            text: `جاوب على اختباري: ${currentQuiz.name}`,
            url: shareUrl
        }).catch(() => copyShareLink(shareUrl));
    } else {
        copyShareLink(shareUrl);
    }
}

function copyShareLink(url) {
    const status = document.getElementById("shareStatus");
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url).then(() => {
            status.textContent = "تم نسخ الرابط! ابعته لأصحابك ✅";
        }).catch(() => showLink(url));
    } else {
        showLink(url);
    }
}

function showLink(url) {
    const status = document.getElementById("shareStatus");
    status.innerHTML = `انسخ الرابط التالي وابعته لأصحابك:<br><textarea id="shareUrl" rows="3" style="width:100%;margin-top:10px;padding:10px;direction:ltr"></textarea>`;
    document.getElementById("shareUrl").value = url;
}

function openSharedQuiz(encoded) {
    let quiz;
    try {
        quiz = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(encoded)))));
        if (!quiz.name || !Array.isArray(quiz.questions) || !quiz.questions.length) throw new Error("Invalid quiz");
    } catch (e) {
        document.querySelector("main").innerHTML = '<h1>الرابط غير صالح</h1><p class="description">اطلب من صاحب الاختبار إرسال رابط جديد.</p>';
        return;
    }

    document.querySelector("main").innerHTML = `
        <h1>اختبار <span style="color:#a18cff">${escapeHtml(quiz.name)}</span></h1>
        <p class="description">جاوب على الأسئلة وشوف نتيجتك في النهاية!</p>
        <div class="card" id="answerCard"></div>
    `;

    const card = document.getElementById("answerCard");
    quiz.questions.forEach((q, index) => {
        const section = document.createElement("div");
        section.className = "question";
        const label = document.createElement("label");
        label.textContent = `${index + 1}. ${q.title}`;
        section.appendChild(label);

        q.options.forEach((option, optionIndex) => {
            const choiceLabel = document.createElement("label");
            choiceLabel.style.display = "flex";
            choiceLabel.style.alignItems = "center";
            choiceLabel.style.gap = "10px";
            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = `answer-${index}`;
            radio.value = String(optionIndex + 1);
            radio.style.width = "auto";
            choiceLabel.appendChild(radio);
            choiceLabel.appendChild(document.createTextNode(option));
            section.appendChild(choiceLabel);
        });
        card.appendChild(section);
    });

    const submit = document.createElement("button");
    submit.textContent = "اعرف نتيجتي";
    submit.onclick = () => {
        let score = 0;
        for (let i = 0; i < quiz.questions.length; i++) {
            const chosen = card.querySelector(`input[name="answer-${i}"]:checked`);
            if (!chosen) {
                alert("جاوب على كل الأسئلة الأول.");
                return;
            }
            if (Number(chosen.value) === Number(quiz.questions[i].correct)) score++;
        }
        card.innerHTML = `
            <h2>خلصت الاختبار 🎉</h2>
            <p>نتيجتك: ${score} من ${quiz.questions.length}</p>
            <p>شكراً لمشاركتك!</p>
            <p class="small-note">النتيجة ظاهرة عندك فقط. صاحب الاختبار لن يستلمها تلقائياً في النسخة دي.</p>
        `;
    };
    card.appendChild(submit);
}

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);
}

const sharedMatch = location.hash.match(/^#quiz=(.+)$/);
if (sharedMatch) {
    openSharedQuiz(sharedMatch[1]);
} else {
    addQuestion();
}
</script>
</body>
</html>
