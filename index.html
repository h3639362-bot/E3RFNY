<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E3RFNY | اعرفني</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#100d1c;color:#fff;
 font-family:Arial,sans-serif;padding:20px;
}
.container{max-width:700px;margin:30px auto}
.card{
 background:#1d1830;border:1px solid #393052;
 border-radius:18px;padding:22px;margin-bottom:18px;
}
h1{text-align:center;color:#c6a7ff}
h2{color:#d8c5ff}
input,textarea,button{
 width:100%;padding:13px;margin:8px 0;
 border-radius:10px;border:1px solid #554773;
 font-size:16px;
}
input,textarea{background:#110e1c;color:white}
button{
 background:#8055c9;color:white;border:0;
 cursor:pointer;font-weight:bold;
}
button.secondary{background:#39304e}
.option{display:flex;gap:8px;align-items:center}
.option input{width:auto}
.question{border-top:1px solid #44395b;padding-top:15px;margin-top:15px}
.small{color:#c2b8d3;font-size:14px}
.hidden{display:none}
.result{background:#29213d;padding:12px;border-radius:10px;margin:10px 0}
</style>
</head>
<body>
<div class="container">
 <div class="card">
  <h1>اعرفني E3RFNY</h1>
  <p class="small" style="text-align:center">اعمل اختبار عن نفسك وشارك الرابط مع أصحابك!</p>
 </div>

 <main id="app"></main>
</div>

<script>
const SUPABASE_URL = "https://qtyrenrlbmofnrhavhyu.supabase.co";
const SUPABASE_KEY = "sb_publishable_YmSzfTvDMu5nry5KUXgQDA_kYfDJSDL";

const app = document.getElementById("app");

async function rpc(name, params){
 const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{
  method:"POST",
  headers:{
   "Content-Type":"application/json",
   "apikey":SUPABASE_KEY,
   "Authorization":`Bearer ${SUPABASE_KEY}`
  },
  body:JSON.stringify(params)
 });
 const data = await response.json();
 if(!response.ok) throw new Error(data.message || data.error || "حصل خطأ في الاتصال");
 return data;
}

let questions=[];

function home(){
 app.innerHTML=`
 <div class="card">
  <h2>اعمل اختبارك 🎯</h2>
  <label>اسمك</label>
  <input id="ownerName" placeholder="اكتب اسمك">
  <div id="questions"></div>
  <button onclick="addQuestion()">+ إضافة سؤال</button>
  <button onclick="createQuiz()">إنشاء الاختبار ومشاركة الرابط</button>
  <p id="message" class="small"></p>
 </div>
 <div class="card">
  <h2>اختباراتي</h2>
  <div id="myQuizzes"></div>
 </div>`;
 questions=[];
 addQuestion();
 showMyQuizzes();
}

function addQuestion(){
 const id=questions.length;
 questions.push({title:"",options:["","","",""],correct:0});
 const div=document.createElement("div");
 div.className="question";
 div.id="q"+id;
 div.innerHTML=`
  <h3>السؤال ${id+1}</h3>
  <input placeholder="اكتب السؤال" oninput="questions[${id}].title=this.value">
  ${[0,1,2,3].map(i=>`
   <div class="option">
    <input placeholder="الاختيار ${i+1}" oninput="questions[${id}].options[${i}]=this.value">
   </div>`).join("")}
  <label>الإجابة الصحيحة</label>
  <select onchange="questions[${id}].correct=Number(this.value)">
   <option value="0">الاختيار الأول</option>
   <option value="1">الاختيار الثاني</option>
   <option value="2">الاختيار الثالث</option>
   <option value="3">الاختيار الرابع</option>
  </select>`;
 document.getElementById("questions").appendChild(div);
}

async function createQuiz(){
 try{
  const title=document.getElementById("ownerName").value.trim();
  if(!title) return alert("اكتب اسمك الأول");
  if(questions.length===0) return alert("أضف سؤالًا");
  for(const q of questions){
   if(!q.title.trim() || q.options.some(x=>!x.trim()))
    return alert("اكمل السؤال وكل الاختيارات");
  }

  const token=crypto.randomUUID();
  const id=await rpc("create_quiz",{
   p_title:title,
   p_questions:questions,
   p_owner_token:token
  });

  const quizId=typeof id==="string"?id:id.id;
  localStorage.setItem("owner_"+quizId,token);

  let list=JSON.parse(localStorage.getItem("myQuizzes")||"[]");
  list.push({id:quizId,title});
  localStorage.setItem("myQuizzes",JSON.stringify(list));

  const link=location.origin+location.pathname+"#quiz="+quizId;
  app.innerHTML=`
   <div class="card">
    <h2>تم إنشاء الاختبار بنجاح 🎉</h2>
    <p>رابط الاختبار:</p>
    <input id="shareLink" readonly value="${link}">
    <button onclick="copyLink()">نسخ الرابط</button>
    <button onclick="shareLink()">مشاركة الاختبار</button>
    <button class="secondary" onclick="showResults('${quizId}')">عرض النتائج</button>
    <button class="secondary" onclick="home()">الرئيسية</button>
   </div>`;
 }catch(e){alert("حصل خطأ: "+e.message)}
}

function copyLink(){
 const input=document.getElementById("shareLink");
 input.select();
 document.execCommand("copy");
 alert("تم نسخ الرابط");
}
async function shareLink(){
 const link=document.getElementById("shareLink").value;
 if(navigator.share){
  try{await navigator.share({title:"اعرفني",url:link})}catch(e){}
 }else{
  await navigator.clipboard.writeText(link);
  alert("تم نسخ الرابط");
 }
}

async function openQuiz(id){
 try{
  const quiz=await rpc("get_public_quiz",{p_quiz_id:id});
  const data=quiz;
  app.innerHTML=`
   <div class="card">
    <h2>اختبار ${escapeHtml(data.title)}</h2>
    <input id="participant" placeholder="اكتب اسمك">
    <div id="quizQuestions"></div>
    <button onclick="submitQuiz('${id}')">إرسال الإجابات</button>
    <p id="quizMessage"></p>
   </div>`;
  window.currentQuiz=data;
  const area=document.getElementById("quizQuestions");
  data.questions.forEach((q,i)=>{
   const div=document.createElement("div");
   div.className="question";
   div.innerHTML=`<h3>${i+1}. ${escapeHtml(q.title)}</h3>`+
   q.options.map((option,j)=>`
    <div class="option">
     <input type="radio" name="answer${i}" value="${j}">
     <span>${escapeHtml(option)}</span>
    </div>`).join("");
   area.appendChild(div);
  });
 }catch(e){app.innerHTML=`<div class="card">تعذر فتح الاختبار: ${escapeHtml(e.message)}</div>`}
}

async function submitQuiz(id){
 try{
  const name=document.getElementById("participant").value.trim();
  if(!name)return alert("اكتب اسمك");
  const answers=[];
  for(let i=0;i<window.currentQuiz.questions.length;i++){
   const selected=document.querySelector(`input[name="answer${i}"]:checked`);
   if(!selected)return alert("جاوب على كل الأسئلة");
   answers.push(Number(selected.value));
  }
  const result=await rpc("submit_quiz_response",{
   p_quiz_id:id,
   p_participant_name:name,
   p_answers:answers
  });
  app.innerHTML=`
   <div class="card">
    <h2>تم إرسال إجاباتك 🎉</h2>
    <h1>${result.score} / ${result.total}</h1>
    <p>شكراً لمشاركتك!</p>
    <button onclick="home()">الرئيسية</button>
   </div>`;
 }catch(e){alert("حصل خطأ: "+e.message)}
}

async function showResults(id){
 try{
  const token=localStorage.getItem("owner_"+id);
  if(!token)return alert("رمز صاحب الاختبار غير موجود على هذا الجهاز");
  const results=await rpc("get_owner_results",{
   p_quiz_id:id,
   p_owner_token:token
  });
  app.innerHTML=`
   <div class="card">
    <h2>نتائج الاختبار</h2>
    <p>عدد المشاركات: ${results.length}</p>
    <div id="results"></div>
    <button onclick="home()">رجوع</button>
   </div>`;
  const area=document.getElementById("results");
  if(!results.length)area.innerHTML="<p>لسه محدش شارك في الاختبار.</p>";
  results.forEach(r=>{
   const div=document.createElement("div");
   div.className="result";
   div.innerHTML=`<strong>${escapeHtml(r.participant_name)}</strong>
   <p>النتيجة: ${r.score} من ${r.total_questions}</p>
   <p class="small">${new Date(r.created_at).toLocaleString("ar-EG")}</p>`;
   area.appendChild(div);
  });
 }catch(e){alert("تعذر عرض النتائج: "+e.message)}
}

function showMyQuizzes(){
 const list=JSON.parse(localStorage.getItem("myQuizzes")||"[]");
 const area=document.getElementById("myQuizzes");
 if(!list.length){area.innerHTML="<p class='small'>لم تنشئ اختبارات بعد.</p>";return}
 area.innerHTML="";
 list.forEach(q=>{
  const div=document.createElement("div");
  div.className="result";
  const title=document.createElement("strong");
  title.textContent=q.title;
  const btn=document.createElement("button");
  btn.textContent="عرض النتائج";
  btn.onclick=()=>showResults(q.id);
  div.append(title,btn);
  area.appendChild(div);
 });
}

function escapeHtml(value){
 return String(value).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function route(){
 const hash=location.hash;
 if(hash.startsWith("#quiz=")){
  const id=hash.slice(6);
  if(id)openQuiz(id);else home();
 }else{
  home();
 }
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
